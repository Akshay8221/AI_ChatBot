{% extends "base.html" %}
{% block title %}{{ message or 'Page Not Found' }} — Smart AI Assistant{% endblock %}

{% block body %}
<div class="error-page">
    <div class="error-content">
        <div class="error-icon">
            <i class="bi bi-emoji-frown"></i>
        </div>
        <h1>404</h1>
        <p class="error-message">{{ message or "The page you're looking for doesn't exist or has been moved." }}</p>
        <a href="{{ url_for('chat.chat_page') }}" class="btn btn-primary-gradient">
            <i class="bi bi-house"></i> Go to Chat
        </a>
    </div>
</div>
{% endblock %}
