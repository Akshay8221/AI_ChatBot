{% extends "base.html" %}
{% block title %}Login — Smart AI Assistant{% endblock %}

{% block body %}
<div class="auth-wrapper">
    <div class="auth-card">
        <div class="auth-header">
            <div class="auth-logo">
                <i class="bi bi-robot"></i>
            </div>
            <h1>Welcome Back</h1>
            <p class="auth-subtitle">Sign in to Smart AI Assistant</p>
        </div>

        <form method="POST" action="{{ url_for('auth.login') }}" class="auth-form">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="form-floating-group">
                <div class="input-icon-wrapper">
                    <i class="bi bi-envelope"></i>
                    <input type="email" id="email" name="email" class="auth-input"
                           placeholder="Email address" required autofocus
                           value="{{ request.form.get('email', '') }}">
                </div>
            </div>

            <div class="form-floating-group">
                <div class="input-icon-wrapper">
                    <i class="bi bi-lock"></i>
                    <input type="password" id="password" name="password" class="auth-input"
                           placeholder="Password" required>
                </div>
            </div>

            <div class="d-flex justify-content-between align-items-center mb-4">
                <label class="auth-checkbox">
                    <input type="checkbox" name="remember">
                    <span class="checkmark"></span>
                    Remember me
                </label>
            </div>

            <button type="submit" class="auth-btn" id="login-btn">
                <span>Sign In</span>
                <i class="bi bi-arrow-right"></i>
            </button>
        </form>

        <div class="auth-footer">
            <p>Don't have an account? <a href="{{ url_for('auth.register') }}">Create one</a></p>
        </div>
    </div>

    <!-- Animated background -->
    <div class="auth-bg">
        <div class="auth-bg-gradient"></div>
        <div class="floating-shapes">
            <div class="shape shape-1"></div>
            <div class="shape shape-2"></div>
            <div class="shape shape-3"></div>
        </div>
    </div>
</div>
{% endblock %}
