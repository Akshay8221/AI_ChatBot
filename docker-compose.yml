version: "3.9"

services:
  web:
    build: .
    container_name: smart-ai-assistant
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - FLASK_ENV=production
      - DATABASE_URL=postgresql://smartai:smartai_password@db:5432/smartai_db
    volumes:
      - uploads_data:/app/uploads
      - instance_data:/app/instance
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    container_name: smart-ai-db
    environment:
      POSTGRES_USER: smartai
      POSTGRES_PASSWORD: smartai_password
      POSTGRES_DB: smartai_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartai -d smartai_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
  uploads_data:
  instance_data:
